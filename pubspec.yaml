name: ai_dungeon_detective
description: "AI Dungeon Detective — Android murder mystery game with AI-generated cases."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # State management — Riverpod 2.x (no codegen)
  flutter_riverpod: ^2.5.1

  # Local persistence — Hive (lightweight, pure Dart)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # Date / time helpers
  intl: ^0.19.0

  # AI backend — hidden WebView wrapping QuillBot's internal API
  webview_flutter: ^4.10.0

  # Model equality / immutability helpers
  equatable: ^2.0.5

  # Typography — Cinzel (noir headings) + Source Sans Pro (body)
  google_fonts: ^6.2.1

  # UUIDs for case/message IDs
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  mocktail: ^1.0.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0D0D0D"
  adaptive_icon_foreground: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/app_icon.png